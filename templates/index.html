<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文本生成器</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container py-4">
        <header class="text-center mb-5">
            <h1 class="display-4">AI文本生成器</h1>
            <p class="lead">输入关键词或短语，让AI为您生成文本</p>
        </header>

        <div class="row">
            <div class="col-md-3">
                <!-- Sidebar for model and topic selection -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">模型选择</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary model-select" data-model="transformer">
                                Transformer (GPT-2)
                            </button>
                            <button class="btn btn-outline-primary model-select" data-model="markov">
                                马尔可夫链
                            </button>
                        </div>
                        <div class="mt-3" id="modelInfo">
                            <small class="text-muted" id="modelDescription">
                                选择一个模型以开始生成文本
                            </small>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">主题选择</h5>
                    </div>
                    <div class="card-body">
                        <select class="form-select" id="topicSelect">
                            <option value="">所有主题</option>
                            {% for en, zh in g.topics.items() %}
                            <option value="{{ en }}">{{ zh }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <!-- Main content area -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">文本生成</h5>
                    </div>
                    <div class="card-body">
                        <form id="generateForm" class="mb-4">
                            <div class="mb-3">
                                <label for="prompt" class="form-label">输入关键词或短句：</label>
                                <input type="text" class="form-control" id="prompt" placeholder="示例：'人工智能的未来'">
                            </div>
                            <button type="submit" class="btn btn-primary">生成文本</button>
                        </form>

                        <div class="mt-4">
                            <h6>生成的文本：</h6>
                            <div id="output" class="output-area p-3 border rounded">
                                <em class="text-muted">生成的文本将显示在这里...</em>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- How it works section -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">工作原理</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <h6>1. 输入处理</h6>
                                <p>您的输入被处理成模型可以理解的形式。</p>
                            </div>
                            <div class="col-md-4">
                                <h6>2. 模型生成</h6>
                                <p>AI模型分析输入并生成相关文本。</p>
                            </div>
                            <div class="col-md-4">
                                <h6>3. 文本输出</h6>
                                <p>生成的文本经过优化后显示给您。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center mt-5 text-muted">
            <p>AI文本生成项目 | 基于深度学习模型</p>
        </footer>
    </div>

    <!-- Hidden div for error messages -->
    <div id="error-messages" class="d-none"
         data-empty-prompt-error="请输入关键词或短语"
         data-copy-success="已复制！"
         data-copy-error="复制到剪贴板失败"
         data-generation-error="生成文本时发生错误"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
